<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Trust Layerの公開統計。個別ドメインではなく、匿名化された帯域と活動状況を表示します。">
  <title>Trust Layer 公開統計</title>
  <style>
    :root { color-scheme: light; --ink: #17212b; --muted: #5b6875; --line: #d8e0e8; --accent: #176b87; --surface: #f7fafc; --error: #a13939; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--ink); background: var(--surface); line-height: 1.6; }
    main { width: min(100% - 2rem, 46rem); margin: 0 auto; padding: 2.5rem 0 4rem; }
    h1 { margin: 0 0 .5rem; font-size: clamp(1.8rem, 7vw, 2.8rem); letter-spacing: -.03em; }
    h2 { margin: 0 0 .75rem; font-size: 1.15rem; }
    p { margin: .5rem 0 1rem; }
    a { color: var(--accent); overflow-wrap: anywhere; }
    .lead, .note { color: var(--muted); }
    .status, section { background: white; border: 1px solid var(--line); border-radius: 14px; padding: 1.25rem; margin-top: 1.25rem; box-shadow: 0 5px 20px rgb(23 33 43 / 4%); }
    .status { border-left: 4px solid var(--accent); }
    .status.error { border-left-color: var(--error); }
    .status p:last-child { margin-bottom: 0; }
    .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: .75rem; margin: 0; }
    .metric { border: 1px solid var(--line); border-radius: 10px; padding: .9rem; }
    dt { color: var(--muted); font-size: .9rem; }
    dd { margin: .25rem 0 0; font-size: 1.5rem; font-weight: 750; letter-spacing: -.02em; }
    .details { display: grid; grid-template-columns: minmax(9rem, auto) 1fr; gap: .5rem 1rem; margin: 0; }
    .details dd { font-size: 1rem; font-weight: 600; letter-spacing: 0; }
    ul { padding-left: 1.2rem; margin: .5rem 0 0; }
    li + li { margin-top: .4rem; }
    @media (max-width: 38rem) {
      .metrics { grid-template-columns: 1fr; }
      .details { grid-template-columns: 1fr; gap: .1rem; }
      .details dd { margin-bottom: .5rem; }
    }
  </style>
</head>
<body>
  <main>
    <p><a href="/">ドメインを確認する</a></p>
    <h1>Trust Layer 公開統計</h1>
    <p class="lead">公開同意を得た観測を、個別のドメインや正確な件数を明かさない帯域で表示します。</p>

    <div id="stats-status" class="status" role="status" aria-live="polite">統計を読み込んでいます。</div>

    <div id="stats-content" hidden>
      <section aria-labelledby="metrics-heading">
        <h2 id="metrics-heading">公開統計</h2>
        <dl class="metrics">
          <div class="metric"><dt>累計の観測受理数</dt><dd id="accepted-observations">—</dd></div>
          <div class="metric"><dt>公開基準を満たすドメイン数</dt><dd id="observed-domains">—</dd></div>
          <div class="metric"><dt>活動中の出所グループ数</dt><dd id="provenance-groups">—</dd></div>
        </dl>
      </section>

      <section aria-labelledby="activity-heading">
        <h2 id="activity-heading">直近の活動状況</h2>
        <p id="recent-activity"></p>
      </section>

      <section aria-labelledby="details-heading">
        <h2 id="details-heading">集計情報</h2>
        <dl class="details">
          <dt>集計対象開始日</dt><dd id="coverage-started-at">—</dd>
          <dt>最終更新時刻</dt><dd id="generated-at">—</dd>
        </dl>
      </section>

      <section aria-labelledby="limitations-heading">
        <h2 id="limitations-heading">この統計について</h2>
        <ul id="limitations"></ul>
      </section>
    </div>

    <p class="note">この統計は公開データの集計表示であり、個別サイトの真実性・安全性を判定するものではありません。</p>
  </main>
  <script src="/public/stats.js" defer></script>
</body>
</html>
