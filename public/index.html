<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="公開ドメインについて、共有観測と確認先を調べるTrust Layerの公開閲覧ページ">
  <title>Trust Layer 公開閲覧</title>
  <style>
    :root { color-scheme: light; --ink: #17212b; --muted: #5b6875; --line: #d8e0e8; --accent: #176b87; --surface: #f7fafc; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--ink); background: var(--surface); line-height: 1.6; }
    main { width: min(100% - 2rem, 46rem); margin: 0 auto; padding: 2.5rem 0 4rem; }
    h1 { margin: 0 0 .5rem; font-size: clamp(1.8rem, 7vw, 2.8rem); letter-spacing: -.03em; }
    h2 { margin: 0 0 .75rem; font-size: 1.15rem; }
    p { margin: .5rem 0 1rem; }
    .lead { color: var(--muted); margin-top: 0; }
    section, form { background: white; border: 1px solid var(--line); border-radius: 14px; padding: 1.25rem; margin-top: 1.25rem; box-shadow: 0 5px 20px rgb(23 33 43 / 4%); }
    label { display: block; font-weight: 650; margin-bottom: .5rem; }
    input, select, button { font: inherit; }
    input, select { width: 100%; border: 1px solid #aebdca; border-radius: 8px; padding: .7rem .75rem; color: var(--ink); background: white; }
    button { border: 0; border-radius: 8px; padding: .7rem 1rem; color: white; background: var(--accent); font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    .row { display: grid; grid-template-columns: 1fr auto; gap: .65rem; align-items: end; }
    .status { border-left: 4px solid var(--accent); padding-left: .9rem; }
    .status.error { border-color: #a13939; }
    .status h2 { margin-bottom: .35rem; }
    .status p:last-child { margin-bottom: 0; }
    .route { padding: .75rem 0; border-top: 1px solid var(--line); }
    .route:first-child { border-top: 0; padding-top: 0; }
    a { color: var(--accent); overflow-wrap: anywhere; }
    ul { padding-left: 1.2rem; margin: .5rem 0 0; }
    small, .note { color: var(--muted); }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    @media (max-width: 34rem) { .row { grid-template-columns: 1fr; } button { width: 100%; } }
  </style>
</head>
<body>
  <main>
    <noscript>このページの照会・送信にはJavaScriptが必要です。無効の場合、入力内容は送信されません。</noscript>
    <h1>Trust Layer 公開閲覧</h1>
    <p class="lead">気になるドメインについて、公開されている共有観測と、次に確認する一次資料の入口を調べます。登録は不要です。</p>

    <section aria-labelledby="lookup-heading">
      <h2 id="lookup-heading">ドメインを確認する</h2>
      <div id="lookup-form">
        <label for="domain">ドメインまたはURL</label>
        <div class="row">
          <input id="domain" type="text" inputmode="url" autocomplete="url" placeholder="example.org" required>
          <button id="lookup-button" type="button">確認する</button>
        </div>
        <p class="note">URLを貼り付けた場合も、ブラウザから送るのはhostnameだけです。pathやqueryは送信しません。</p>
      </div>
      <div id="result" aria-live="polite" hidden></div>
    </section>

    <section aria-labelledby="feedback-heading">
      <h2 id="feedback-heading">短いフィードバック</h2>
      <p class="note">本文は受け付けません。表示改善のため、固定項目だけを送ります。</p>
      <div id="feedback-form">
        <label for="feedback-category">当てはまるもの</label>
        <select id="feedback-category">
          <option value="source_unclear">確認先が分からない</option>
          <option value="display_unclear">表示が分からない</option>
          <option value="load_failed">読み込み失敗</option>
          <option value="helpful">役立った</option>
        </select>
        <label for="feedback-domain" style="margin-top:.75rem">関連する公開ドメイン（任意）</label>
        <input id="feedback-domain" type="text" inputmode="url" placeholder="example.org">
        <button id="feedback-button" type="button" style="margin-top:.75rem">送信する</button>
        <p id="feedback-result" class="note" aria-live="polite"></p>
      </div>
    </section>

    <p class="note">共有観測がないことは、サイトの正しさや安全性の評価ではありません。第三者解析タグは使用していません。</p>
  </main>
  <script src="/public/app.js" defer></script>

</body>
</html>
